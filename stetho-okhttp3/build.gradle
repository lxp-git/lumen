apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    namespace 'com.facebook.stetho.okhttp3'
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion rootProject.ext.targetSdkVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        abortOnError false
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation project(':stetho')
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    // OkHttp 4.x is wire-compatible with the 3.x API stetho-okhttp3 was
    // originally built against and matches emochi-android's runtime version.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
            }
        }
    }
}
