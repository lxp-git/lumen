plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'io.github.lxp-git.lumen'
}

android {
    namespace 'dev.lumen.sample'
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "dev.lumen.sample"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lintOptions {
        abortOnError false
    }
}

lumen {
    enabled = true
    injectOkHttp = true
    // Non-default so Lumen.getStatus can prove the DSL reached the process.
    retentionDays = 2
}

dependencies {
    // OkHttp is the app's HTTP stack. lumen-okhttp is added by the plugin on debug.
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation "com.squareup.okhttp3:okhttp:${rootProject.ext.okhttpVersion}"
}
