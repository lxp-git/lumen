apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    namespace 'com.facebook.stetho'
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        // Raised from 14 to match the consumer (emochi-android minSdk = 24).
        minSdkVersion 24
        targetSdkVersion rootProject.ext.targetSdkVersion
        consumerProguardFiles 'proguard-consumer.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        // Stetho's commons-cli usage path uses Apache reflective bits;
        // they're never reached on Android but lint still warns.
        abortOnError false
    }

    // JitPack invokes `publishToMavenLocal`, which requires the library to
    // declare which variant to publish. Picking `release` keeps the binary
    // free of test/debug-only symbols.
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation 'commons-cli:commons-cli:1.2'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'androidx.annotation:annotation:1.7.1'
    // Optional: reflection probes whether Fragment / AndroidX core are present at runtime.
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                // groupId / version are injected by JitPack via -Pgroup= and
                // -Pversion= command-line properties; artifactId defaults to
                // the project name (`stetho`).
            }
        }
    }
}
