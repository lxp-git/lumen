apply plugin: 'com.android.library'

android {
    namespace 'com.facebook.stetho'
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        // Raised from 14 to match the consumer (emochi-android minSdk = 24).
        minSdkVersion 24
        targetSdkVersion rootProject.ext.targetSdkVersion
        consumerProguardFiles 'proguard-consumer.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        // Stetho's commons-cli usage path uses Apache reflective bits;
        // they're never reached on Android but lint still warns.
        abortOnError false
    }
}

dependencies {
    implementation 'commons-cli:commons-cli:1.2'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'androidx.annotation:annotation:1.7.1'
    // Optional: reflection probes whether Fragment / AndroidX core are present at runtime.
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
