buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Aligned with the emochi-android consumer (AGP 8.9.1 / Gradle 8.14)
        // so the fork can be plugged in via `includeBuild` without forcing a
        // second toolchain into the host project.
        classpath 'com.android.tools.build:gradle:8.9.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

ext {
    compileSdkVersion = 36
    targetSdkVersion = 36
}
