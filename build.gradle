buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20'
        classpath 'com.vanniktech:gradle-maven-publish-plugin:0.34.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

ext {
    compileSdkVersion = 36
    targetSdkVersion = 36
    minSdkVersion = 21
    okhttpVersion = '4.12.0'
    lumenGroup = LUMEN_GROUP
    lumenMavenGroup = LUMEN_MAVEN_GROUP
    // -Plumen.localVersion=X builds an unsigned local copy under version X
    // (scripts/publish-local.sh). Releases never set it; they are signed for Central.
    lumenVersion = findProperty('lumen.localVersion') ?: LUMEN_VERSION
    lumenLocalPublish = findProperty('lumen.localVersion') != null
}
