// Maven Central publication for :lumen-runtime and :lumen-okhttp.
// Credentials live in ~/.gradle/gradle.properties (mavenCentralUsername / Password + signing*).
//
//   ./gradlew :lumen-runtime:publishAndReleaseToMavenCentral \
//             :lumen-okhttp:publishAndReleaseToMavenCentral \
//             --no-configuration-cache
//
// scripts/publish-local.sh publishes unsigned copies to build/maven-repo instead.

apply plugin: 'com.vanniktech.maven.publish'

group = rootProject.ext.lumenMavenGroup
version = rootProject.ext.lumenVersion

mavenPublishing {
    publishToMavenCentral()
    if (!rootProject.ext.lumenLocalPublish) {
        signAllPublications()
    }
    coordinates(rootProject.ext.lumenMavenGroup, project.name, rootProject.ext.lumenVersion.toString())
    pom {
        name = project.name
        description = 'Lumen Android debug agent (Chrome DevTools)'
        inceptionYear = '2026'
        url = 'https://github.com/lxp-git/lumen'
        licenses {
            license {
                name = 'MIT License'
                url = 'https://github.com/lxp-git/lumen/blob/main/LICENSE'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'lxp-git'
                name = 'Xuanping'
                url = 'https://github.com/lxp-git'
            }
        }
        scm {
            url = 'https://github.com/lxp-git/lumen'
            connection = 'scm:git:https://github.com/lxp-git/lumen.git'
            developerConnection = 'scm:git:ssh://git@github.com/lxp-git/lumen.git'
        }
    }
}

// GnuPG 2.4 keyring is not a BC secring; sign with the gpg binary.
if (!rootProject.ext.lumenLocalPublish) {
    signing {
        useGpgCmd()
    }
}

if (rootProject.ext.lumenLocalPublish) {
    // Local copies ship an empty javadoc jar: Dokka is slow and only Central needs docs.
    tasks.matching { it.name.startsWith('javaDoc') && it.name.endsWith('Generation') }
        .configureEach { enabled = false }
    tasks.withType(AbstractArchiveTask).matching { it.name.startsWith('javaDoc') }
        .configureEach { exclude '**' } // no stale docs from an earlier full build
}

// build/maven-repo, the plugin's default repository too (lumen-gradle-plugin/build.gradle).
publishing {
    repositories {
        maven {
            name = 'Lumen'
            url = rootProject.layout.buildDirectory.dir('maven-repo')
        }
    }
}
